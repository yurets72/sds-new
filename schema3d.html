<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДСК — интерактивная 3D-схема линии</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Golos Text", "Segoe UI", sans-serif;
    background: #1E1D1A;
    color: #ECEAE4;
    overflow: hidden;
  }
  .stage { position: relative; width: 100%; height: 100%; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .fallback-img {
    display: none; width: 100%; height: 100%;
    object-fit: contain; background: #FFFFFF; padding: 24px;
  }
  .no-webgl canvas { display: none; }
  .no-webgl .fallback-img { display: block; }
  .no-webgl .slider { display: none; }

  .slider {
    position: absolute; left: 16px; right: 16px; bottom: 16px;
    display: flex; align-items: center; gap: 12px;
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    color: #ECEAE4;
    pointer-events: none;
  }
  .slider span { opacity: 0.7; }
  .slider input[type=range] {
    flex: 1; height: 3px; pointer-events: auto; cursor: pointer;
    accent-color: #F2B705; background: rgba(236,234,228,0.3);
    -webkit-appearance: none; appearance: none;
  }
  .slider input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #F2B705; border: 0; cursor: pointer;
  }
  .slider input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: #F2B705; border: 0; cursor: pointer;
  }

  .tooltip {
    position: absolute;
    background: #191919; color: #ECEAE4;
    padding: 12px 14px; max-width: 240px;
    font-size: 14px; line-height: 1.4;
    pointer-events: auto;
    opacity: 0; transform: translateY(6px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .tooltip.visible { opacity: 1; transform: translateY(0); }
  .tooltip h4 {
    font-family: "Oswald", sans-serif; font-weight: 600;
    font-size: 14px; color: #F2B705; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .tooltip .close {
    position: absolute; top: 6px; right: 8px;
    background: none; border: 0; color: #ECEAE4;
    font-size: 18px; cursor: pointer; line-height: 1;
  }

  @media (max-width: 600px) {
    .slider { font-size: 11px; left: 12px; right: 12px; bottom: 12px; }
    .slider input[type=range]::-webkit-slider-thumb { width: 22px; height: 22px; }
    .tooltip { max-width: 200px; font-size: 13px; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <img class="fallback-img" src="assets/img/P054_schema.jpg" alt="Схема линии ДСК: от бункера до штабелей фракций">

  <div class="slider">
    <span>Собрано</span>
    <input type="range" id="explode" min="0" max="100" value="0">
    <span>Разобрано</span>
  </div>

  <div class="tooltip" id="tooltip">
    <button class="close" id="tooltip-close" aria-label="Закрыть">×</button>
    <h4 id="tooltip-title"></h4>
    <p id="tooltip-text"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  // WebGL check
  var canvas = document.createElement('canvas');
  var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl || !window.THREE) { document.body.classList.add('no-webgl'); return; }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Scene
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1E1D1A);

  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
  camera.position.set(0, 9, 20);
  camera.lookAt(0, 0, 0);

  var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  var dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(5, 10, 7);
  scene.add(dir);

  // Materials
  var matYellow = new THREE.MeshStandardMaterial({ color: 0xF2B705, roughness: 0.7 });
  var matDark = new THREE.MeshStandardMaterial({ color: 0x191919, roughness: 0.8 });
  var matGrey = new THREE.MeshStandardMaterial({ color: 0x55524B, roughness: 0.6 });
  var matStone = new THREE.MeshStandardMaterial({ color: 0xCFCABD, roughness: 0.9 });

  // Nodes: mesh, home position, explode offset, label, description
  var nodes = [
    { mesh: new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 2), matDark),
      home: [-6, 0.75, 0], explode: [-8, 0.75, 0],
      title: 'Приёмный бункер', text: 'Принимает сырьё с карьера. Объём 8 м³.' },
    { mesh: new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 1.5), matGrey),
      home: [-4, 0.4, 0], explode: [-5, 0.4, 0],
      title: 'Питатель', text: 'Дозирует сырьё на конвейер равномерно.' },
    { mesh: new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), matYellow),
      home: [-2, 1, 0], explode: [-2, 1, -3],
      title: 'Щековая дробилка PE', text: 'Первичное дробление до 200 мм. Серия зависит от производительности.' },
    { mesh: new THREE.Mesh(new THREE.BoxGeometry(3, 0.3, 0.8), matGrey),
      home: [0.5, 0.5, 0], explode: [0.5, 0.5, 3],
      title: 'Конвейер', text: 'Транспортирует материал между узлами. Ширина 650–800 мм.' },
    { mesh: new THREE.Mesh(new THREE.CylinderGeometry(1, 1.2, 2.5, 16), matYellow),
      home: [2.5, 1.25, 0], explode: [2.5, 1.25, -3],
      title: 'Конусная дробилка DP', text: 'Вторичное дробление. Гидравлическая регулировка зазора.' },
    { mesh: new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 1.5), matDark),
      home: [5, 1, 0], explode: [5, 1, 3],
      title: 'Грохот', text: 'Сортировка на фракции. 2–3 деки в зависимости от задачи.' },
    { mesh: new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.2, 8), matStone),
      home: [7, 0.6, -2], explode: [7, 0.6, -4],
      title: 'Штабель 0–5 мм', text: 'Готовый продукт 0–5 мм — отгружается заказчику прямо со штабеля.' },
    { mesh: new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.2, 8), matStone),
      home: [8.5, 0.6, -2], explode: [8.5, 0.6, -4],
      title: 'Штабель 5–20 мм', text: 'Основная фракция для дорожного строительства.' },
    { mesh: new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.2, 8), matStone),
      home: [10, 0.6, -2], explode: [10, 0.6, -4],
      title: 'Штабель 20–40 мм', text: 'Крупная фракция для бетона и оснований.' }
  ];
  nodes.forEach(function(n) { scene.add(n.mesh); });

  // Flow particles
  var flowMat = new THREE.MeshStandardMaterial({ color: 0xCFCABD, roughness: 0.9 });
  var particles = [];
  for (var i = 0; i < 24; i++) {
    var p = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 6), flowMat);
    p.visible = false;
    scene.add(p);
    particles.push({ mesh: p, t: Math.random() });
  }

  // State
  var explodeValue = 0;
  var autoRotate = !reduce;
  var rotAngle = 0;
  var userRotX = 0, userRotY = 0;
  var dragging = false, lastX = 0, lastY = 0;

  // Slider
  document.getElementById('explode').addEventListener('input', function(e) {
    explodeValue = parseInt(e.target.value) / 100;
    updateNodes();
  });

  function updateNodes() {
    nodes.forEach(function(n) {
      n.mesh.position.x = n.home[0] + (n.explode[0] - n.home[0]) * explodeValue;
      n.mesh.position.y = n.home[1] + (n.explode[1] - n.home[1]) * explodeValue;
      n.mesh.position.z = n.home[2] + (n.explode[2] - n.home[2]) * explodeValue;
    });
  }

  // Tooltip
  var tooltip = document.getElementById('tooltip');
  var tooltipTitle = document.getElementById('tooltip-title');
  var tooltipText = document.getElementById('tooltip-text');
  document.getElementById('tooltip-close').addEventListener('click', function() {
    tooltip.classList.remove('visible');
  });
  document.addEventListener('click', function(e) {
    if (!tooltip.contains(e.target)) tooltip.classList.remove('visible');
  });

  // Raycaster for click
  var raycaster = new THREE.Raycaster();
  var mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('click', function(e) {
    var rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(nodes.map(function(n) { return n.mesh; }));
    if (hits.length > 0) {
      var node = nodes.find(function(n) { return n.mesh === hits[0].object; });
      if (node) {
        tooltipTitle.textContent = node.title;
        tooltipText.textContent = node.text;
        var x = e.clientX - rect.left + 12;
        var y = e.clientY - rect.top + 12;
        tooltip.style.left = x + 'px';
        tooltip.style.top = y + 'px';
        tooltip.classList.add('visible');
      }
    }
  });

  // Mouse drag rotation
  renderer.domElement.addEventListener('mousedown', function(e) {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    autoRotate = false;
  });
  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    userRotY += (e.clientX - lastX) * 0.005;
    userRotX += (e.clientY - lastY) * 0.005;
    userRotX = Math.max(-0.5, Math.min(0.5, userRotX));
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mouseup', function() { dragging = false; });

  // Touch drag
  renderer.domElement.addEventListener('touchstart', function(e) {
    dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    autoRotate = false;
  }, { passive: true });
  renderer.domElement.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    userRotY += (e.touches[0].clientX - lastX) * 0.005;
    userRotX += (e.touches[0].clientY - lastY) * 0.005;
    userRotX = Math.max(-0.5, Math.min(0.5, userRotX));
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }, { passive: true });
  renderer.domElement.addEventListener('touchend', function() { dragging = false; });

  // Resize
  function resize() {
    var w = renderer.domElement.clientWidth;
    var h = renderer.domElement.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // Loop
  function animate() {
    requestAnimationFrame(animate);

    if (autoRotate && !reduce) {
      rotAngle += 0.004;
    }

    // Camera
    var radius = 20;
    camera.position.x = Math.sin(rotAngle + userRotY) * radius;
    camera.position.z = Math.cos(rotAngle + userRotY) * radius;
    camera.position.y = 9 + userRotX * 10;
    camera.lookAt(0, 0, 0);

    // Flow
    if (!reduce) {
      particles.forEach(function(p) {
        p.t += 0.008;
        if (p.t > 1) p.t = 0;
        p.mesh.visible = true;
        var t = p.t;
        p.mesh.position.x = -6 + t * 16;
        p.mesh.position.y = 1 + Math.sin(t * Math.PI) * 0.6;
        p.mesh.position.z = Math.sin(t * Math.PI * 3) * 0.4;
      });
    } else {
      particles.forEach(function(p) { p.mesh.visible = false; });
    }

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
