<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДСК — интерактивная 3D-схема линии</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Golos Text", "Segoe UI", sans-serif;
    background: #1E1D1A;
    color: #ECEAE4;
    overflow: hidden;
  }
  .scene { position: relative; }
  .scene canvas { display: block; width: 100%; aspect-ratio: 21 / 9; background: #1E1D1A; }
  .controls {
    padding: 16px 20px;
    background: #ECEAE4;
    border-top: 1px solid #CFCABD;
  }
  .slider-row {
    display: flex; align-items: center; gap: 12px;
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase;
    color: #191919;
    margin-bottom: 12px;
  }
  .slider-row input[type=range] {
    flex: 1; accent-color: #F2B705;
    height: 6px; cursor: pointer;
  }
  .btn-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .btn-row button {
    background: #ECEAE4; color: #191919;
    border: 1px solid #191919; padding: 10px 8px;
    font-family: "Golos Text", sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: background-color .15s ease;
  }
  .btn-row button:hover { background: #D9D5CA; }
  .btn-row button.active { background: #F2B705; border-color: #F2B705; }
  .btn-row button:active { transform: translateY(1px); }
  @media (max-width: 600px) {
    .btn-row { grid-template-columns: repeat(2, 1fr); }
    .scene canvas { aspect-ratio: 4 / 3; }
  }
  .fallback-img {
    display: none; width: 100%; height: auto;
    background: #FFFFFF; padding: 12px;
  }
  .no-webgl .scene canvas { display: none; }
  .no-webgl .controls { display: none; }
  .no-webgl .fallback-img { display: block; }
</style>
</head>
<body>

<div class="scene">
  <canvas id="c"></canvas>
  <img class="fallback-img" src="assets/img/P054_schema.jpg" alt="Схема линии ДСК: от бункера до штабелей фракций">
</div>

<div class="controls">
  <div class="slider-row">
    <span>Собрано</span>
    <input type="range" id="explode" min="0" max="100" value="0">
    <span>Разобрано</span>
  </div>
  <div class="btn-row">
    <button id="btn-assemble">Собрать</button>
    <button id="btn-flow">Поток камня</button>
    <button id="btn-rotate">Авто-вращение</button>
    <button id="btn-reset">Сброс камеры</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  // Проверка WebGL
  var canvas = document.createElement('canvas');
  var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl || !window.THREE) {
    document.body.classList.add('no-webgl');
    return;
  }

  // Reduced motion
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Сцена
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1E1D1A);

  var camera = new THREE.PerspectiveCamera(45, 21/9, 0.1, 1000);
  camera.position.set(0, 8, 18);
  camera.lookAt(0, 0, 0);

  var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight * 9/21);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // Свет
  var ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  var directional = new THREE.DirectionalLight(0xffffff, 0.8);
  directional.position.set(5, 10, 7);
  scene.add(directional);

  // Материалы
  var matYellow = new THREE.MeshStandardMaterial({ color: 0xF2B705, roughness: 0.7 });
  var matDark = new THREE.MeshStandardMaterial({ color: 0x191919, roughness: 0.8 });
  var matGrey = new THREE.MeshStandardMaterial({ color: 0x55524B, roughness: 0.6 });
  var matStone = new THREE.MeshStandardMaterial({ color: 0xCFCABD, roughness: 0.9 });

  // Узлы линии (позиции в собранном состоянии)
  var nodes = [];
  
  // 1. Бункер приёмный
  var hopper = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 2), matDark);
  hopper.position.set(-6, 0.75, 0);
  scene.add(hopper);
  nodes.push({ mesh: hopper, home: [-6, 0.75, 0], explode: [-8, 0.75, 0] });

  // 2. Питатель
  var feeder = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 1.5), matGrey);
  feeder.position.set(-4, 0.4, 0);
  scene.add(feeder);
  nodes.push({ mesh: feeder, home: [-4, 0.4, 0], explode: [-5, 0.4, 0] });

  // 3. Щековая дробилка
  var jaw = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), matYellow);
  jaw.position.set(-2, 1, 0);
  scene.add(jaw);
  nodes.push({ mesh: jaw, home: [-2, 1, 0], explode: [-2, 1, -3] });

  // 4. Конвейер 1
  var conv1 = new THREE.Mesh(new THREE.BoxGeometry(3, 0.3, 0.8), matGrey);
  conv1.position.set(0.5, 0.5, 0);
  conv1.rotation.z = 0.1;
  scene.add(conv1);
  nodes.push({ mesh: conv1, home: [0.5, 0.5, 0], explode: [0.5, 0.5, 3] });

  // 5. Конусная дробилка
  var cone = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.2, 2.5, 16), matYellow);
  cone.position.set(2.5, 1.25, 0);
  scene.add(cone);
  nodes.push({ mesh: cone, home: [2.5, 1.25, 0], explode: [2.5, 1.25, -3] });

  // 6. Грохот
  var screen = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 1.5), matDark);
  screen.position.set(5, 1, 0);
  scene.add(screen);
  nodes.push({ mesh: screen, home: [5, 1, 0], explode: [5, 1, 3] });

  // 7. Конвейеры к штабелям
  for (var i = 0; i < 3; i++) {
    var conv = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 0.6), matGrey);
    conv.position.set(5 + i * 1.5, 0.5, -1.5);
    conv.rotation.y = -0.3;
    scene.add(conv);
    nodes.push({ mesh: conv, home: [5 + i * 1.5, 0.5, -1.5], explode: [5 + i * 1.5, 0.5, -3] });
  }

  // 8. Штабеля фракций
  for (var i = 0; i < 3; i++) {
    var pile = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.2, 8), matStone);
    pile.position.set(7 + i * 1.5, 0.6, -2);
    scene.add(pile);
    nodes.push({ mesh: pile, home: [7 + i * 1.5, 0.6, -2], explode: [7 + i * 1.5, 0.6, -4] });
  }

  // Поток камня (частицы)
  var flowParticles = [];
  var flowActive = false;
  var flowMat = new THREE.MeshStandardMaterial({ color: 0xCFCABD, roughness: 0.9 });
  
  for (var i = 0; i < 20; i++) {
    var stone = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), flowMat);
    stone.position.set(-6, 1, 0);
    stone.visible = false;
    scene.add(stone);
    flowParticles.push({ mesh: stone, progress: 0 });
  }

  // Управление
  var explodeValue = 0;
  var autoRotate = false;
  var rotationAngle = 0;

  document.getElementById('explode').addEventListener('input', function(e) {
    explodeValue = parseInt(e.target.value) / 100;
    updateNodes();
  });

  document.getElementById('btn-assemble').addEventListener('click', function() {
    explodeValue = 0;
    document.getElementById('explode').value = 0;
    updateNodes();
  });

  document.getElementById('btn-flow').addEventListener('click', function() {
    flowActive = !flowActive;
    this.classList.toggle('active', flowActive);
  });

  document.getElementById('btn-rotate').addEventListener('click', function() {
    autoRotate = !autoRotate;
    this.classList.toggle('active', autoRotate);
  });

  document.getElementById('btn-reset').addEventListener('click', function() {
    camera.position.set(0, 8, 18);
    camera.lookAt(0, 0, 0);
    rotationAngle = 0;
  });

  function updateNodes() {
    nodes.forEach(function(node) {
      node.mesh.position.x = node.home[0] + (node.explode[0] - node.home[0]) * explodeValue;
      node.mesh.position.y = node.home[1] + (node.explode[1] - node.home[1]) * explodeValue;
      node.mesh.position.z = node.home[2] + (node.explode[2] - node.home[2]) * explodeValue;
    });
  }

  // Пост-сообщения от родителя
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'sds-config') {
      // Можно использовать для подсветки узлов
      console.log('Config:', e.data);
    }
  });

  // Анимация
  function animate() {
    requestAnimationFrame(animate);

    if (autoRotate && !reduce) {
      rotationAngle += 0.005;
      camera.position.x = Math.sin(rotationAngle) * 18;
      camera.position.z = Math.cos(rotationAngle) * 18;
      camera.lookAt(0, 0, 0);
    }

    if (flowActive && !reduce) {
      flowParticles.forEach(function(p) {
        p.progress += 0.01;
        if (p.progress > 1) p.progress = 0;
        p.mesh.visible = true;
        // Простая траектория по линии
        var t = p.progress;
        p.mesh.position.x = -6 + t * 13;
        p.mesh.position.y = 1 + Math.sin(t * Math.PI) * 0.5;
        p.mesh.position.z = Math.sin(t * Math.PI * 2) * 0.3;
      });
    } else {
      flowParticles.forEach(function(p) {
        p.mesh.visible = false;
      });
    }

    renderer.render(scene, camera);
  }

  animate();

  // Ресайз
  window.addEventListener('resize', function() {
    var aspect = window.innerWidth / (window.innerHeight * 9/21);
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight * 9/21);
  });
})();
</script>
</body>
</html>
